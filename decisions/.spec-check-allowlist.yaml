# spec-check allowlist for deferred decision backfills.
#
# Every R-* requirement defined in specs/NNNN-*/requirements.md must
# carry at least one decisions/DEC-*.md file whose front-matter
# `requirement:` field names that ID. R-* IDs listed below under
# `deferred:` are deferred backfills: the requirements shipped before
# the matching DEC file landed; the DEC lands in a later pass.
#
# Format: a YAML list of R-* IDs under the `deferred` key. Each entry
# carries a short note for context.
#
# Removing an entry from this list requires landing the matching DEC
# in the same commit.
#
# `roles_deferred:` lists role IDs that should appear as `owner_role`
# in spec traceability tables but were left blank in spec 0001 because
# the role itself was deferred. This block is informational; the
# spec_check gate does not currently enforce it. When the matching
# role lands, remove the entry here and add the owner_role link in
# traceability.md.

deferred:
  # Retrieval subsystem (spec 0002). R-RET-001..R-RET-005 are all
  # resolved by DEC-RET-001..DEC-RET-005 respectively. No deferred
  # entries remain for spec 0002.

  # LLM provider subsystem (spec 0003). R-LLM-001 is resolved by
  # DEC-LLM-001-provider-abstraction-default-anthropic.md.
  - id: R-LLM-002
    note: no env reads inside src/agent/llm.py; explicit Keys object; DEC backfill pending
  - id: R-LLM-003
    note: provider switch via env var without code edits; DEC backfill pending

  # Eval suites and thresholds (spec 0004). R-EVL-001 is resolved by
  # DEC-EVL-001-four-suite-eval-gate-with-thresholds.md.
  - id: R-EVL-002
    note: deterministic CI eval runs without vendor keys; DEC backfill pending
  - id: R-EVL-003
    note: each suite targets a distinct failure mode; DEC backfill pending
  - id: R-EVL-004
    note: experiments re-use the same four suites for baseline vs variant; DEC backfill pending
  - id: R-EVL-005
    note: release ledger records which gates each release passed; DEC backfill pending

  # Deploy + secrets (spec 0005). R-DEP-001 is resolved by
  # DEC-DEP-001-byok-streamlit-no-committed-keys.md.
  - id: R-DEP-002
    note: missing-key fallback to deterministic retrieval; DEC backfill pending
  - id: R-DEP-003
    note: STREAMLIT_LOCAL=1 gates .env loading for local dev; DEC backfill pending

  # Citation faithfulness (spec 0006). R-CIT-001 is resolved by
  # DEC-CIT-001-verbatim-span-verification-post-generation.md.
  - id: R-CIT-002
    note: citations carry CIK/accession/section/span/offsets/chunk_id; DEC backfill pending
  - id: R-CIT-003
    note: verifier accepts DocumentChunk or SearchResult-like inputs; DEC backfill pending

roles_deferred:
  # No role-owner gaps in spec 0001: every R-CDCP-* requirement names
  # an owner role from the six core roles installed in this pass.
  # Add entries here when a future spec names a role that has not yet
  # been registered under .agents/roles/.
