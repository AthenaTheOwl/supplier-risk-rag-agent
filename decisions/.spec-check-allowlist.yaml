# spec-check allowlist for deferred decision backfills.
#
# Every R-* requirement defined in specs/NNNN-*/requirements.md must
# carry at least one decisions/DEC-*.md file whose front-matter
# `requirement:` field names that ID. R-* IDs listed below under
# `deferred:` are deferred backfills: the requirements shipped before
# the matching DEC file landed; the DEC lands in a later pass.
#
# Format: a YAML list of R-* IDs under the `deferred` key. Each entry
# carries a short note for context.
#
# Removing an entry from this list requires landing the matching DEC
# in the same commit.
#
# `roles_deferred:` lists role IDs that should appear as `owner_role`
# in spec traceability tables but were left blank in spec 0001 because
# the role itself was deferred. This block is informational; the
# spec_check gate does not currently enforce it. When the matching
# role lands, remove the entry here and add the owner_role link in
# traceability.md.

deferred:
  # Retrieval subsystem (spec 0002). R-RET-001..R-RET-005 are all
  # resolved by DEC-RET-001..DEC-RET-005 respectively. No deferred
  # entries remain for spec 0002.

  # LLM provider subsystem (spec 0003). R-LLM-001..R-LLM-003 are all
  # resolved by DEC-LLM-001..DEC-LLM-003 respectively. No deferred
  # entries remain for spec 0003.

  # Eval suites and thresholds (spec 0004). R-EVL-001..R-EVL-005 are
  # all resolved by DEC-EVL-001..DEC-EVL-005 respectively. No deferred
  # entries remain for spec 0004.

  # Deploy + secrets (spec 0005). R-DEP-001..R-DEP-003 are all
  # resolved by DEC-DEP-001..DEC-DEP-003 respectively. No deferred
  # entries remain for spec 0005.

  # Citation faithfulness (spec 0006). R-CIT-001..R-CIT-003 are all
  # resolved by DEC-CIT-001..DEC-CIT-003 respectively. No deferred
  # entries remain for spec 0006.

roles_deferred:
  # Audit pass on 2026-05-24: every R-* across specs 0001-0006 already
  # carries an owner_role token in the matching traceability.md table.
  # Twenty-nine R-* requirements, all mapped to one of the six
  # installed roles (`control.coordinator`, `product.spec-writer`,
  # `engineering.implementation`, `engineering.code-reviewer`,
  # `science.proof-gate-runner`, `learning.dream-orchestrator`). Zero
  # owner_role tokens added in this pass; one pending-graduation
  # marker recorded on R-CDCP-007 where the closest installed fit
  # (`product.spec-writer`) is a stretch and a future
  # `learning.skill-curator` role from the deferred 44-role catalog
  # would land closer to the surface area.
  - id: R-CDCP-007
    note: |
      Skill graduation surface; assigned to product.spec-writer
      today, pending a `learning.skill-curator` role from the
      deferred 44-role catalog noted in .agents/CATALOG.md `##
      Deferred work`. The current assignment is the closest
      installed fit; the marker is informational and does not
      block any gate.
