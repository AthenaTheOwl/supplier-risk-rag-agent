# Experiment 01 — cross-encoder reranker

variant_name: cross-encoder-rerank-minilm-l6

# Deterministic hybrid retrieves a wide pool; cross-encoder reorders to top_k.
candidate_pool: 50

# Default model: small (~80 MB), CPU-friendly, well-known baseline.
# Alternatives worth ablating later:
#   BAAI/bge-reranker-base   (~280 MB, stronger on out-of-domain queries)
#   BAAI/bge-reranker-large  (~1.3 GB, strongest, slow on CPU)
reranker_model: cross-encoder/ms-marco-MiniLM-L-6-v2

# What we expect to see (pre-registered hypothesis):
#   - Recall@5 improves modestly: the wider pool surfaces near-misses the
#     deterministic weighted score buried.
#   - MRR improves more than Recall@5: the reranker is supposed to put the
#     right doc at position 1, not just inside the top-5.
#   - Citation faithfulness is neutral or slightly worse: rerank pulls in
#     chunks the deterministic score wouldn't, which can include
#     plausibly-relevant-but-not-supporting passages.
#   - Refusal precision is neutral: refusal logic operates on phrases in the
#     query, not on retrieved candidates.

# Decision rule (encoded in notes.md after run):
#   Ship if: Recall@5 delta >= +0.05 AND citation faithfulness >= baseline.
#   Document and shelve if: mixed signal or model cost not justified.
