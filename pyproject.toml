[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "supplier-risk-rag-agent"
version = "0.1.0"
description = "Supplier-risk RAG agent with citation faithfulness and abstention evals."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Vignesh Gopalakrishnan" }]
dependencies = [
    "anthropic>=0.39.0",
    "beautifulsoup4>=4.12.0",
    "chromadb>=0.5.0",
    "httpx>=0.27.0",
    "lxml>=5.3.0",
    "openai>=1.50.0",
    "pydantic>=2.9.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.2",
    "rank-bm25>=0.2.2",
    "rich>=13.9.0",
    "streamlit>=1.40.0",
    "tenacity>=9.0.0",
    "tiktoken>=0.8.0",
]

[dependency-groups]
dev = [
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
]

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["src"]
omit = [
    "src/evals/runner.py",
    "src/ingest/run_ingest.py",
    "src/ingest/sec_client.py",
    "src/agent/llm.py",
]

[tool.coverage.report]
show_missing = true
fail_under = 70
