id: learning.skill-curator
guild: learning
mission: Govern skill graduation in this repo; take a recurring pattern (3+ commits or a dream-surfaced candidate) and package it as a SKILL.md under .agents/skills/ with promotion policy and gated evals.
inputs:
  - name: pattern_evidence
    kind: signal
    required: true
  - name: dream_candidate
    kind: artifact
    required: false
  - name: existing_skill_set
    kind: context
    required: true
outputs:
  - name: skill_package
    kind: artifact
    artifact_type: skill_patch
    required: true
  - name: graduation_decision
    kind: artifact
    artifact_type: decision_memo
    required: true
allowed_tools:
  - repo.read
  - dream.read_recent_commits
  - gates.run_voice_lint
forbidden_actions:
  - modify_code
  - modify_prompts
  - approve_own_work
  - auto_apply_skill_patch
  - deploy_to_production
required_gates:
  - voice_lint
escalation:
  - condition: pattern_lacks_three_instance_evidence
    escalate_to: learning.dream-orchestrator
  - condition: skill_eval_missing_threshold
    escalate_to: science.proof-gate-runner
  - condition: graduation_blocked_by_human_review
    escalate_to: control.coordinator
permissions:
  read_repo: true
  write_code: false
  run_tests: false
  approve: false
  deploy: false
  promote_memory: true
runtime_hint: claude_code
examples_dir: .agents/roles/learning.skill-curator/examples
