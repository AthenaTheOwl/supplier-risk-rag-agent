name: replay-freshness

# Replays the canonical sample on a fixed schedule and commits the dated
# replay record, so the replay-equivalence claim is re-checked twice a
# month instead of when someone remembers (DEC-EVL-015).
#
# The replay sequence is the replay-smoke path of the packet-and-replay
# job in `.github/workflows/run-evidence-gates.yml`: sync the dev deps,
# check out the recorded sandbox SHA, run `scripts/replay_run.py`. The
# only addition is what happens after a replay that exits 0: return to
# main and commit the new replay record plus its per-replay ledger, and
# nothing else. A replay that fails commits nothing and opens an issue.

on:
  schedule:
    - cron: "17 6 1,15 * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: replay-freshness
  cancel-in-progress: false

env:
  CANONICAL_SAMPLE: run-643dff8f3b9c
  DEFAULT_BRANCH: main
  # The replay commit (and a rebase, if main moves mid-run) is made as the Actions bot.
  GIT_AUTHOR_NAME: github-actions[bot]
  GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
  GIT_COMMITTER_NAME: github-actions[bot]
  GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com

jobs:
  replay-and-commit:
    name: replay canonical sample and commit the record
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: checkout this repo (full history for replay checkout)
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          path: supplier-risk-rag-agent

      - name: setup python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: install project for replay smoke
        uses: astral-sh/setup-uv@v5

      - name: sync dev deps for replay
        working-directory: supplier-risk-rag-agent
        run: uv sync --group dev

      - name: extract sandbox SHA from canonical sample Run record
        id: sandbox
        working-directory: supplier-risk-rag-agent
        run: |
          SANDBOX_URI=$(python -c 'import json, sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["sandbox_image_ref"])' ops/run-records/${CANONICAL_SAMPLE}.json)
          SANDBOX_SHA=$(echo "$SANDBOX_URI" | sed -E 's|^repo://[^@]+@([a-f0-9]{40})/.*|\1|')
          if [ -z "$SANDBOX_SHA" ] || [ "$SANDBOX_SHA" = "$SANDBOX_URI" ]; then
            echo "::error title=Could not extract sandbox SHA::sandbox_image_ref did not match the repo:// URI grammar with a 40-char SHA. Got: $SANDBOX_URI"
            exit 1
          fi
          echo "sandbox_sha=$SANDBOX_SHA" >> "$GITHUB_OUTPUT"
          echo "extracted sandbox SHA: $SANDBOX_SHA"

      - name: checkout recorded sandbox SHA
        working-directory: supplier-risk-rag-agent
        run: git checkout ${{ steps.sandbox.outputs.sandbox_sha }}

      - name: replay-smoke
        working-directory: supplier-risk-rag-agent
        run: uv run python scripts/replay_run.py --run-id ${CANONICAL_SAMPLE}

      - name: return to main and stage only the new replay record and ledger
        working-directory: supplier-risk-rag-agent
        run: |
          set -euo pipefail
          # The replay wrote exactly one report; the report names its ledger.
          mapfile -t NEW_REPORTS < <(git ls-files --others --exclude-standard -- "ops/replay-records/${CANONICAL_SAMPLE}/")
          if [ "${#NEW_REPORTS[@]}" -ne 1 ]; then
            echo "expected exactly one new replay record, found ${#NEW_REPORTS[@]}: ${NEW_REPORTS[*]:-none}" >&2
            exit 1
          fi
          NEW_REPORT="${NEW_REPORTS[0]}"
          NEW_LEDGER=$(python -c 'import json, sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["replay_event_ledger"])' "$NEW_REPORT")
          test -f "$NEW_LEDGER" || { echo "replay ledger named by the report is missing: $NEW_LEDGER" >&2; exit 1; }
          # The evidence quorum ages a record by replayed_at; refuse to commit one it cannot date.
          python -c 'import json, sys; d = json.load(open(sys.argv[1], encoding="utf-8")); sys.exit(0 if d.get("replay_equivalent") is True and d.get("replayed_at") else "record is not an equivalent replay with replayed_at")' "$NEW_REPORT"
          cp "$NEW_REPORT" "$RUNNER_TEMP/new-replay-record.json"
          cp "$NEW_LEDGER" "$RUNNER_TEMP/new-replay-ledger.jsonl"
          # The replay overlays nothing; anything tracked that changed at the sandbox SHA is discarded.
          if ! git diff --quiet; then
            git diff --stat
            git checkout HEAD -- .
          fi
          git checkout "$DEFAULT_BRANCH"
          mkdir -p "$(dirname "$NEW_REPORT")"
          cp "$RUNNER_TEMP/new-replay-record.json" "$NEW_REPORT"
          cp "$RUNNER_TEMP/new-replay-ledger.jsonl" "$NEW_LEDGER"
          git add -- "$NEW_REPORT" "$NEW_LEDGER"
          STAGED=$(git diff --cached --name-only | sort)
          EXPECTED=$(printf '%s\n' "$NEW_REPORT" "$NEW_LEDGER" | sort)
          if [ "$STAGED" != "$EXPECTED" ]; then
            echo "staged set differs from the two replay files:" >&2
            echo "$STAGED" >&2
            exit 1
          fi
          git commit -m "ops: scheduled replay of ${CANONICAL_SAMPLE}"
          git show --stat --format='%h %s' HEAD

      - name: push the replay commit
        working-directory: supplier-risk-rag-agent
        run: |
          set -euo pipefail
          if ! git push origin "HEAD:${DEFAULT_BRANCH}"; then
            # main moved while the replay ran; the commit only adds two new files, so a rebase cannot conflict.
            git pull --rebase origin "$DEFAULT_BRANCH"
            git push origin "HEAD:${DEFAULT_BRANCH}"
          fi

      - name: open an issue when the scheduled replay fails
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh issue create \
            --title "Scheduled replay failed on $(date -u +%Y-%m-%d)" \
            --body "The replay-freshness workflow did not commit a replay record. No new record landed, so the 30-day evidence window keeps shrinking. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
