name: edgar-refresh

on:
  schedule:
    - cron: "23 9 1 * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Plan filings only; do not download filing documents or write corpus artifacts"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v5
      - name: install dependencies
        run: uv sync --group dev
      - name: require SEC User-Agent contact
        run: |
          if [ -z "${SEC_USER_AGENT}" ]; then
            echo "::error title=SEC_USER_AGENT missing::Set repository variable SEC_USER_AGENT to a descriptive app/contact string before running live EDGAR refresh."
            exit 1
          fi
      - name: refresh generated EDGAR corpus
        run: |
          DRY_RUN_FLAG=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY_RUN_FLAG="--dry-run"
          fi
          uv run python -m src.ingest.run_ingest \
            --refresh-edgar \
            --manifest data/sample_manifest.json \
            --output data/generated/edgar_corpus/chunks.jsonl \
            --refresh-manifest data/generated/edgar_corpus/manifest.json \
            --requests-per-second 4 \
            $DRY_RUN_FLAG
      - name: upload generated corpus
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: edgar-generated-corpus-${{ github.run_id }}
          path: |
            data/generated/edgar_corpus/chunks.jsonl
            data/generated/edgar_corpus/manifest.json
          if-no-files-found: error
