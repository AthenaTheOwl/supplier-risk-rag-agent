name: streamlit keep-alive

on:
  schedule:
    - cron: "17 13 * * 1,4"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: wake hosted demo
        run: |
          set -uo pipefail
          URL="https://supplier-risk-rag-agent.streamlit.app"
          JAR=$(mktemp)
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0 Safari/537.36"
          # Streamlit Cloud bounces every first visit through its auth endpoint to set a
          # cookie, public apps included. Follow the bounce with a cookie jar, as a
          # browser does, and judge by where it lands.
          out=$(curl -s -L -c "$JAR" -b "$JAR" -A "$UA" --max-redirs 10 --max-time 60 \
                  --retry 2 --retry-delay 10 -o /dev/null \
                  -w '%{http_code} %{url_effective}' "$URL/" || echo "000 curl-error")
          code=${out%% *}; final=${out#* }
          echo "landed on: $final (HTTP $code)"
          case "$final" in
            "$URL"/*|"$URL")
              if [ "$code" = "200" ]; then echo "Demo is publicly reachable."; exit 0; fi ;;
            *share.streamlit.io*|*/-/login*)
              echo "::error::The hosted demo is NOT public: a cookie-carrying visitor ends at $final. Fix at https://share.streamlit.io -> this app -> Share -> Make this app public."
              exit 1 ;;
          esac
          echo "::error::Hosted demo unhealthy: HTTP $code at $final. If the app is asleep or was dropped for inactivity, open it once in a browser to wake or reboot it."
          exit 1
