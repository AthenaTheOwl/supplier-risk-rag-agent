name: streamlit keep-alive

on:
  schedule:
    - cron: "17 13 * * 1,4"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: wake hosted demo
        run: |
          curl --fail --location --max-time 45 --retry 2 --retry-delay 10 \
            https://supplier-risk-rag-agent.streamlit.app/ \
            --output /tmp/supplier-risk-rag-agent.html
          test -s /tmp/supplier-risk-rag-agent.html
