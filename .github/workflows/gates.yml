name: gates

on:
  pull_request:
  push:
    branches: [main]

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: install gate dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml jsonschema
      - name: voice_lint
        run: python scripts/voice_lint.py
      - name: check_no_bom
        run: python scripts/check_no_bom.py
      - name: spec_check
        run: python scripts/spec_check.py
      - name: validate_decisions
        run: python scripts/validate_decisions.py
      - name: validate_decision_records
        run: python scripts/validate_decision_records.py
      - name: validate_roles
        run: python scripts/validate_roles.py
      - name: validate_tools
        run: python scripts/validate_tools.py
      - name: validate_policies
        run: python scripts/validate_policies.py
      - name: validate_skills
        run: python scripts/validate_skills.py
      - name: validate_data_conformance
        run: python scripts/validate_data_conformance.py
      - name: validate_dreams
        run: python scripts/validate_dreams.py
      - name: check_schema_cache_freshness
        run: python scripts/check_schema_cache_freshness.py
      - name: check_eval_suite_count
        run: python scripts/check_eval_suite_count.py
      - name: validate_run_evidence
        run: python scripts/validate_run_evidence.py
